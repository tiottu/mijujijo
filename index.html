<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>B - 블로그 글 점검</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>B</h1>
    <p>네이버 블로그 글 주소를 넣으면 오탈자를 점검해 드려요</p>
  </header>

  <main>
    <form id="form" class="url-form">
      <label for="url">블로그 글 주소</label>
      <input id="url" type="url" inputmode="url" autocomplete="off"
             placeholder="https://blog.naver.com/아이디/글번호" required>
      <button id="submit" type="submit">글 불러오기</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="result" class="result" hidden>
      <h2 id="title"></h2>
      <p id="meta" class="meta"></p>
      <section id="seo" class="seo">
        <h3>글 점검 <small>참고용 기준이에요</small></h3>
        <div class="score-row">
          <div id="score" class="score">0</div>
          <div class="score-label">점 / 100</div>
        </div>
        <label for="kw">대표 키워드</label>
        <input id="kw" type="text" autocomplete="off" placeholder="예: 제주도 맛집">
        <p class="hint">자주 쓴 단어 (누르면 대표 키워드로 입력돼요)</p>
        <div id="top-words" class="chips"></div>
        <ul id="seo-items" class="seo-items"></ul>
      </section>

      <button id="check" type="button" class="check-btn">오탈자·문장 검수하기</button>
      <p id="check-status" class="status" role="status" aria-live="polite"></p>
      <div id="issues" class="issues" hidden></div>
      <div id="body" class="body"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="seo.js"></script>
  <script src="app.js"></script>
</body>
</html>
